<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Splitly — Tip & Bill Split</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --ink-muted: #4a635a;
      --paper: #f2f7f4;
      --surface: rgba(255, 255, 255, 0.72);
      --accent: #0f6b5c;
      --accent-soft: #d4ebe4;
      --accent-press: #0a5247;
      --warn: #8a3b2a;
      --warn-bg: #f8ebe6;
      --line: rgba(26, 46, 40, 0.12);
      --radius: 14px;
      --shadow: 0 12px 40px rgba(15, 50, 40, 0.08);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Outfit", system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #c8e8dc 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 100% 0%, #b8d4e8 0%, transparent 50%),
        linear-gradient(165deg, #eaf3ef 0%, #f5f8f6 45%, #e8eef2 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      margin: 0 auto;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
      animation: rise 0.55s ease-out both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      margin-bottom: 1.5rem;
      animation: rise 0.55s ease-out 0.08s both;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 9vw, 2.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 0.4rem;
      color: var(--ink);
    }

    .tagline {
      margin: 0;
      font-size: 0.95rem;
      color: var(--ink-muted);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      animation: rise 0.55s ease-out 0.16s both;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix,
    .suffix {
      position: absolute;
      font-weight: 500;
      color: var(--ink-muted);
      pointer-events: none;
      font-size: 1.05rem;
    }

    .prefix {
      left: 0.9rem;
    }

    .suffix {
      right: 0.9rem;
    }

    input[type="number"] {
      width: 100%;
      appearance: textfield;
      -moz-appearance: textfield;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="number"].has-prefix {
      padding-left: 1.85rem;
    }

    input[type="number"].has-suffix {
      padding-right: 2.4rem;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input[type="number"].invalid {
      border-color: var(--warn);
      box-shadow: 0 0 0 3px var(--warn-bg);
    }

    .tip-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .tip-btn {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 0.7rem 0.4rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    .tip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tip-btn:active {
      transform: scale(0.97);
    }

    .tip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .tip-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .msg {
      min-height: 1.35rem;
      margin: 0.65rem 0 0;
      font-size: 0.875rem;
      color: var(--warn);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .results {
      margin-top: 1.15rem;
      padding: 1.15rem 1.1rem;
      border-radius: var(--radius);
      background: linear-gradient(145deg, #0f6b5c 0%, #145a6e 100%);
      color: #f4faf8;
      animation: rise 0.55s ease-out 0.24s both;
    }

    .results h2 {
      margin: 0 0 0.85rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: 0.01em;
    }

    .result-grid {
      display: grid;
      gap: 0.75rem;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .result-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .result-row .label {
      font-size: 0.9rem;
      opacity: 0.8;
      font-weight: 400;
    }

    .result-row .value {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.15s ease;
    }

    .result-row.per-person .value {
      font-size: 1.65rem;
    }

    .result-row .value.flash {
      animation: flash 0.35s ease;
    }

    @keyframes flash {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1 class="brand">Splitly</h1>
      <p class="tagline">Tip, split, and settle up in seconds.</p>
    </header>

    <section class="panel" aria-label="Bill inputs">
      <div class="field">
        <label for="bill">Bill amount</label>
        <div class="input-wrap">
          <span class="prefix" aria-hidden="true">$</span>
          <input
            id="bill"
            class="has-prefix"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0.00"
            value="0"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="field">
        <label id="tip-label">Tip percent</label>
        <div class="tip-row" role="group" aria-labelledby="tip-label">
          <button type="button" class="tip-btn" data-tip="10" aria-pressed="false">10%</button>
          <button type="button" class="tip-btn active" data-tip="15" aria-pressed="true">15%</button>
          <button type="button" class="tip-btn" data-tip="20" aria-pressed="false">20%</button>
        </div>
        <div class="input-wrap">
          <input
            id="tip"
            class="has-suffix"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.1"
            placeholder="Custom"
            value="15"
            aria-label="Custom tip percent"
            autocomplete="off"
          />
          <span class="suffix" aria-hidden="true">%</span>
        </div>
      </div>

      <div class="field">
        <label for="people">Number of people</label>
        <div class="input-wrap">
          <input
            id="people"
            type="number"
            inputmode="numeric"
            min="1"
            step="1"
            placeholder="1"
            value="1"
            autocomplete="off"
          />
        </div>
      </div>

      <p id="message" class="msg" role="status" aria-live="polite"></p>
    </section>

    <section class="results" aria-label="Calculated totals" aria-live="polite">
      <h2>Your split</h2>
      <div class="result-grid">
        <div class="result-row">
          <span class="label">Tip</span>
          <span id="tip-amount" class="value">$0.00</span>
        </div>
        <div class="result-row">
          <span class="label">Total</span>
          <span id="total-amount" class="value">$0.00</span>
        </div>
        <div class="result-row per-person">
          <span class="label">Per person</span>
          <span id="per-person" class="value">$0.00</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const billEl = document.getElementById("bill");
      const tipEl = document.getElementById("tip");
      const peopleEl = document.getElementById("people");
      const messageEl = document.getElementById("message");
      const tipAmountEl = document.getElementById("tip-amount");
      const totalAmountEl = document.getElementById("total-amount");
      const perPersonEl = document.getElementById("per-person");
      const tipButtons = document.querySelectorAll(".tip-btn");

      const money = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      });

      function parseNum(value) {
        if (value === "" || value === null || value === undefined) return null;
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }

      function setActiveTipButton(percent) {
        tipButtons.forEach((btn) => {
          const match = Number(btn.dataset.tip) === percent;
          btn.classList.toggle("active", match);
          btn.setAttribute("aria-pressed", match ? "true" : "false");
        });
      }

      function flash(el) {
        el.classList.remove("flash");
        void el.offsetWidth;
        el.classList.add("flash");
      }

      function showMessage(text) {
        messageEl.textContent = text || "";
        messageEl.classList.toggle("show", Boolean(text));
      }

      function setInvalid(el, invalid) {
        el.classList.toggle("invalid", invalid);
      }

      function calculate() {
        const bill = parseNum(billEl.value);
        const tip = parseNum(tipEl.value);
        const people = parseNum(peopleEl.value);

        let error = "";
        let billBad = false;
        let tipBad = false;
        let peopleBad = false;

        if (bill === null) {
          error = "Enter a bill amount to get started.";
          billBad = true;
        } else if (bill < 0) {
          error = "Bill amount can’t be negative.";
          billBad = true;
        }

        if (!error) {
          if (tip === null) {
            error = "Enter a tip percent, or tap a quick option.";
            tipBad = true;
          } else if (tip < 0) {
            error = "Tip percent can’t be negative.";
            tipBad = true;
          }
        }

        if (!error) {
          if (people === null) {
            error = "How many people are splitting?";
            peopleBad = true;
          } else if (people < 1) {
            error = "You’ll need at least 1 person.";
            peopleBad = true;
          } else if (!Number.isInteger(people)) {
            error = "Number of people should be a whole number.";
            peopleBad = true;
          }
        }

        setInvalid(billEl, billBad);
        setInvalid(tipEl, tipBad);
        setInvalid(peopleEl, peopleBad);
        showMessage(error);

        if (error) {
          tipAmountEl.textContent = "—";
          totalAmountEl.textContent = "—";
          perPersonEl.textContent = "—";
          return;
        }

        const tipValue = bill * (tip / 100);
        const total = bill + tipValue;
        const each = total / people;

        const nextTip = money.format(tipValue);
        const nextTotal = money.format(total);
        const nextEach = money.format(each);

        if (tipAmountEl.textContent !== nextTip) {
          tipAmountEl.textContent = nextTip;
          flash(tipAmountEl);
        }
        if (totalAmountEl.textContent !== nextTotal) {
          totalAmountEl.textContent = nextTotal;
          flash(totalAmountEl);
        }
        if (perPersonEl.textContent !== nextEach) {
          perPersonEl.textContent = nextEach;
          flash(perPersonEl);
        }
      }

      tipButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const percent = Number(btn.dataset.tip);
          tipEl.value = String(percent);
          setActiveTipButton(percent);
          calculate();
        });
      });

      tipEl.addEventListener("input", () => {
        const tip = parseNum(tipEl.value);
        const presets = [10, 15, 20];
        if (tip !== null && presets.includes(tip)) {
          setActiveTipButton(tip);
        } else {
          setActiveTipButton(null);
        }
        calculate();
      });

      [billEl, peopleEl].forEach((el) => {
        el.addEventListener("input", calculate);
      });

      calculate();
    })();
  </script>
</body>
</html>
