<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Splitly — Tip & Bill Split</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("splitly-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --ink-muted: #4a635a;
      --paper: #f2f7f4;
      --surface: rgba(255, 255, 255, 0.72);
      --input-bg: #fff;
      --accent: #0f6b5c;
      --accent-soft: #d4ebe4;
      --accent-press: #0a5247;
      --warn: #8a3b2a;
      --warn-bg: #f8ebe6;
      --line: rgba(26, 46, 40, 0.12);
      --radius: 14px;
      --shadow: 0 12px 40px rgba(15, 50, 40, 0.08);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Outfit", system-ui, sans-serif;
      --bg-a: #c8e8dc;
      --bg-b: #b8d4e8;
      --bg-grad: linear-gradient(165deg, #eaf3ef 0%, #f5f8f6 45%, #e8eef2 100%);
      --noise-blend: multiply;
      --noise-opacity: 0.35;
      --results-grad: linear-gradient(145deg, #0f6b5c 0%, #145a6e 100%);
      --results-text: #f4faf8;
      --results-line: rgba(255, 255, 255, 0.18);
      --toggle-bg: rgba(255, 255, 255, 0.85);
    }

    html[data-theme="dark"] {
      --ink: #e4f0eb;
      --ink-muted: #9bb5ab;
      --paper: #121a17;
      --surface: rgba(22, 34, 30, 0.82);
      --input-bg: #1a2622;
      --accent: #3dbaa3;
      --accent-soft: rgba(61, 186, 163, 0.22);
      --accent-press: #2a9a86;
      --warn: #e8a090;
      --warn-bg: rgba(232, 160, 144, 0.18);
      --line: rgba(228, 240, 235, 0.14);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --bg-a: #1a3d34;
      --bg-b: #1a2e44;
      --bg-grad: linear-gradient(165deg, #0f1614 0%, #141c1a 45%, #101820 100%);
      --noise-blend: soft-light;
      --noise-opacity: 0.2;
      --results-grad: linear-gradient(145deg, #1a5c52 0%, #1a4558 100%);
      --results-text: #f4faf8;
      --results-line: rgba(255, 255, 255, 0.14);
      --toggle-bg: rgba(26, 38, 34, 0.9);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, var(--bg-a) 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 100% 0%, var(--bg-b) 0%, transparent 50%),
        var(--bg-grad);
      background-attachment: fixed;
      transition: color 0.2s ease, background 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: var(--noise-blend);
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      margin: 0 auto;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
      animation: rise 0.55s ease-out both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      margin-bottom: 1.5rem;
      animation: rise 0.55s ease-out 0.08s both;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .theme-toggle {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      margin-top: 0.15rem;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--toggle-bg);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .theme-toggle:active {
      transform: scale(0.96);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle .icon-moon {
      display: none;
    }

    html[data-theme="dark"] .theme-toggle .icon-sun {
      display: none;
    }

    html[data-theme="dark"] .theme-toggle .icon-moon {
      display: block;
    }

    .theme-toggle svg {
      width: 1.15rem;
      height: 1.15rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 9vw, 2.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 0.4rem;
      color: var(--ink);
    }

    .tagline {
      margin: 0;
      font-size: 0.95rem;
      color: var(--ink-muted);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      animation: rise 0.55s ease-out 0.16s both;
    }

    .field {
      margin-bottom: 1.15rem;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix,
    .suffix {
      position: absolute;
      font-weight: 500;
      color: var(--ink-muted);
      pointer-events: none;
      font-size: 1.05rem;
    }

    .prefix {
      left: 0.9rem;
    }

    .suffix {
      right: 0.9rem;
    }

    input[type="number"] {
      width: 100%;
      appearance: textfield;
      -moz-appearance: textfield;
      border: 1.5px solid var(--line);
      background: var(--input-bg);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    input[type="number"].has-prefix {
      padding-left: 1.85rem;
    }

    input[type="number"].has-suffix {
      padding-right: 2.4rem;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input[type="number"].invalid {
      border-color: var(--warn);
      box-shadow: 0 0 0 3px var(--warn-bg);
    }

    .tip-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .tip-btn {
      border: 1.5px solid var(--line);
      background: var(--input-bg);
      border-radius: 10px;
      padding: 0.7rem 0.4rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    .check-field {
      margin-top: 1.15rem;
      margin-bottom: 0;
    }

    .check-label {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin: 0;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.35;
    }

    .check-label input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 1.15rem;
      height: 1.15rem;
      margin: 0.1rem 0 0;
      border: 1.5px solid var(--line);
      border-radius: 5px;
      background: var(--input-bg);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      position: relative;
    }

    .check-label input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-label input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 0.3rem;
      top: 0.1rem;
      width: 0.28rem;
      height: 0.5rem;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .check-label input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .round-extra {
      margin: 0.45rem 0 0 1.8rem;
      font-size: 0.82rem;
      color: var(--ink-muted);
      opacity: 0;
      transform: translateY(-3px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      min-height: 1.2rem;
    }

    .round-extra.show {
      opacity: 1;
      transform: translateY(0);
    }

    .tip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tip-btn:active {
      transform: scale(0.97);
    }

    .tip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .tip-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .msg {
      min-height: 1.35rem;
      margin: 0.65rem 0 0;
      font-size: 0.875rem;
      color: var(--warn);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .results {
      margin-top: 1.15rem;
      padding: 1.15rem 1.1rem;
      border-radius: var(--radius);
      background: var(--results-grad);
      color: var(--results-text);
      animation: rise 0.55s ease-out 0.24s both;
    }

    .results h2 {
      margin: 0 0 0.85rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: 0.01em;
    }

    .result-grid {
      display: grid;
      gap: 0.75rem;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid var(--results-line);
    }

    .result-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .result-row .label {
      font-size: 0.9rem;
      opacity: 0.8;
      font-weight: 400;
    }

    .result-row .value {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.15s ease;
    }

    .result-row.per-person .value {
      font-size: 1.65rem;
    }

    .result-row .value.flash {
      animation: flash 0.35s ease;
    }

    @keyframes flash {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="header-top">
        <div>
          <h1 class="brand">Splitly</h1>
          <p class="tagline">Tip, split, and settle up in seconds.</p>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Switch to dark mode"
          title="Toggle dark mode"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="panel" aria-label="Bill inputs">
      <div class="field">
        <label for="bill">Bill amount</label>
        <div class="input-wrap">
          <span class="prefix" aria-hidden="true">$</span>
          <input
            id="bill"
            class="has-prefix"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0.00"
            value="0"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="field">
        <label id="tip-label">Tip percent</label>
        <div class="tip-row" role="group" aria-labelledby="tip-label">
          <button type="button" class="tip-btn" data-tip="10" aria-pressed="false">10%</button>
          <button type="button" class="tip-btn active" data-tip="15" aria-pressed="true">15%</button>
          <button type="button" class="tip-btn" data-tip="20" aria-pressed="false">20%</button>
        </div>
        <div class="input-wrap">
          <input
            id="tip"
            class="has-suffix"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.1"
            placeholder="Custom"
            value="15"
            aria-label="Custom tip percent"
            autocomplete="off"
          />
          <span class="suffix" aria-hidden="true">%</span>
        </div>
      </div>

      <div class="field">
        <label for="people">Number of people</label>
        <div class="input-wrap">
          <input
            id="people"
            type="number"
            inputmode="numeric"
            min="1"
            step="1"
            placeholder="1"
            value="1"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="field check-field">
        <label class="check-label" for="round-up">
          <input type="checkbox" id="round-up" />
          <span>Round each share up to the nearest whole amount</span>
        </label>
        <p id="round-extra" class="round-extra" aria-live="polite"></p>
      </div>

      <p id="message" class="msg" role="status" aria-live="polite"></p>
    </section>

    <section class="results" aria-label="Calculated totals" aria-live="polite">
      <h2>Your split</h2>
      <div class="result-grid">
        <div class="result-row">
          <span class="label">Tip</span>
          <span id="tip-amount" class="value">$0.00</span>
        </div>
        <div class="result-row">
          <span class="label">Total</span>
          <span id="total-amount" class="value">$0.00</span>
        </div>
        <div class="result-row per-person">
          <span class="label">Per person</span>
          <span id="per-person" class="value">$0.00</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const THEME_KEY = "splitly-theme";
      const htmlEl = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      const billEl = document.getElementById("bill");
      const tipEl = document.getElementById("tip");
      const peopleEl = document.getElementById("people");
      const roundUpEl = document.getElementById("round-up");
      const roundExtraEl = document.getElementById("round-extra");
      const messageEl = document.getElementById("message");
      const tipAmountEl = document.getElementById("tip-amount");
      const totalAmountEl = document.getElementById("total-amount");
      const perPersonEl = document.getElementById("per-person");
      const tipButtons = document.querySelectorAll(".tip-btn");

      const money = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      });

      function getPreferredTheme() {
        try {
          const saved = localStorage.getItem(THEME_KEY);
          if (saved === "light" || saved === "dark") return saved;
        } catch (_) {}
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function applyTheme(theme) {
        htmlEl.setAttribute("data-theme", theme);
        const isDark = theme === "dark";
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode"
        );
      }

      function setTheme(theme) {
        applyTheme(theme);
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (_) {}
      }

      applyTheme(getPreferredTheme());

      themeToggle.addEventListener("click", () => {
        const next =
          htmlEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
        setTheme(next);
      });

      function parseNum(value) {
        if (value === "" || value === null || value === undefined) return null;
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }

      function setActiveTipButton(percent) {
        tipButtons.forEach((btn) => {
          const match = Number(btn.dataset.tip) === percent;
          btn.classList.toggle("active", match);
          btn.setAttribute("aria-pressed", match ? "true" : "false");
        });
      }

      function flash(el) {
        el.classList.remove("flash");
        void el.offsetWidth;
        el.classList.add("flash");
      }

      function showMessage(text) {
        messageEl.textContent = text || "";
        messageEl.classList.toggle("show", Boolean(text));
      }

      function showRoundExtra(text) {
        roundExtraEl.textContent = text || "";
        roundExtraEl.classList.toggle("show", Boolean(text));
      }

      function setInvalid(el, invalid) {
        el.classList.toggle("invalid", invalid);
      }

      function calculate() {
        const bill = parseNum(billEl.value);
        const tip = parseNum(tipEl.value);
        const people = parseNum(peopleEl.value);
        const roundUp = roundUpEl.checked;

        let error = "";
        let billBad = false;
        let tipBad = false;
        let peopleBad = false;

        if (bill === null) {
          error = "Enter a bill amount to get started.";
          billBad = true;
        } else if (bill < 0) {
          error = "Bill amount can’t be negative.";
          billBad = true;
        }

        if (!error) {
          if (tip === null) {
            error = "Enter a tip percent, or tap a quick option.";
            tipBad = true;
          } else if (tip < 0) {
            error = "Tip percent can’t be negative.";
            tipBad = true;
          }
        }

        if (!error) {
          if (people === null) {
            error = "How many people are splitting?";
            peopleBad = true;
          } else if (people < 1) {
            error = "You’ll need at least 1 person.";
            peopleBad = true;
          } else if (!Number.isInteger(people)) {
            error = "Number of people should be a whole number.";
            peopleBad = true;
          }
        }

        setInvalid(billEl, billBad);
        setInvalid(tipEl, tipBad);
        setInvalid(peopleEl, peopleBad);
        showMessage(error);

        if (error) {
          tipAmountEl.textContent = "—";
          totalAmountEl.textContent = "—";
          perPersonEl.textContent = "—";
          showRoundExtra("");
          return;
        }

        const tipValue = bill * (tip / 100);
        const total = bill + tipValue;
        let each = total / people;
        let extra = 0;

        if (roundUp) {
          each = Math.ceil(each);
          extra = each * people - total;
        }

        const nextTip = money.format(tipValue);
        const nextTotal = money.format(total);
        const nextEach = money.format(each);

        if (tipAmountEl.textContent !== nextTip) {
          tipAmountEl.textContent = nextTip;
          flash(tipAmountEl);
        }
        if (totalAmountEl.textContent !== nextTotal) {
          totalAmountEl.textContent = nextTotal;
          flash(totalAmountEl);
        }
        if (perPersonEl.textContent !== nextEach) {
          perPersonEl.textContent = nextEach;
          flash(perPersonEl);
        }

        if (roundUp) {
          showRoundExtra(
            extra > 0
              ? `Collects ${money.format(extra)} extra in total`
              : "No extra — shares already land on whole amounts"
          );
        } else {
          showRoundExtra("");
        }
      }

      tipButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const percent = Number(btn.dataset.tip);
          tipEl.value = String(percent);
          setActiveTipButton(percent);
          calculate();
        });
      });

      tipEl.addEventListener("input", () => {
        const tip = parseNum(tipEl.value);
        const presets = [10, 15, 20];
        if (tip !== null && presets.includes(tip)) {
          setActiveTipButton(tip);
        } else {
          setActiveTipButton(null);
        }
        calculate();
      });

      [billEl, peopleEl].forEach((el) => {
        el.addEventListener("input", calculate);
      });

      roundUpEl.addEventListener("change", calculate);

      calculate();
    })();
  </script>
</body>
</html>
